<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>金十快讯中文播报</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>金十快讯中文播报</h1>

      <label class="row">
        <span>开启播报</span>
        <input id="enabled" type="checkbox" />
      </label>

      <label>
        <span>语音</span>
        <select id="voice"></select>
      </label>

      <label>
        <span>语速</span>
        <input id="rate" type="range" min="0.7" max="1.4" step="0.1" />
      </label>

      <label>
        <span>音调</span>
        <input id="pitch" type="range" min="0.7" max="1.3" step="0.1" />
      </label>

      <label>
        <span>音量</span>
        <input id="volume" type="range" min="0.3" max="1" step="0.1" />
      </label>

      <button id="stop" type="button">停止播报</button>
      <p id="tips">打开金十网页后，插件会自动朗读新增快讯。</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
